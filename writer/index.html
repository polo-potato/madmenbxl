<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WHAT IF / Writer's Room</title>
  <link rel="stylesheet" href="writer.css?v=8">
  <link rel="stylesheet" href="navigation.css?v=2">
  <link rel="stylesheet" href="history.css?v=1">
  <link rel="stylesheet" href="map-studio.css?v=1">
</head>
<body>
  <header><div><span class="eyebrow">WHAT IF / CONTENT</span><h1>WRITER'S ROOM</h1></div><nav><a href="../index.html" target="_blank">[ OPEN GAME ↗ ]</a><button data-theme-toggle>[ DARK MODE ]</button><button id="reload">[ RELOAD FILE ]</button></nav></header>
  <main><aside><nav class="modules" aria-label="Content structure"></nav><div id="guide"></div><div class="detected" id="detected"></div></aside><section class="editor"><div class="editor-head"><span id="path">content/prologue.md</span><div class="history" aria-label="Edit history"><button id="undo" title="Undo — Command Z">↶ <small>⌘Z</small></button><button id="redo" title="Redo — Command Shift Z">↷ <small>⌘⇧Z</small></button></div><span id="state">LOADED FROM GITHUB</span></div><div id="map-studio" class="map-studio" hidden><div class="map-toolbar"><button id="map-add">[ + ELEMENT ]</button><button id="map-duplicate">[ DUPLICATE ]</button><button id="map-delete">[ DELETE ]</button><button id="map-raw">[ RAW MARKDOWN ]</button></div><div class="map-workspace"><div class="map-stage"><div id="map-canvas" class="map-canvas"></div><small>DRAG ELEMENTS TO MOVE THEM</small></div><form id="map-inspector" class="map-inspector"><p class="kicker">SELECT AN ELEMENT</p></form></div></div><textarea id="markdown" aria-label="Full module Markdown" spellcheck="false"></textarea><div class="save"><p><b>TO SAVE</b><br>Copy, open GitHub, replace everything with <kbd>⌘A</kbd> <kbd>⌘V</kbd>, then commit.</p><button id="publish">[ COPY ALL + OPEN GITHUB ↗ ]</button></div></section></main>
  <div class="toast" id="toast" role="status"></div>
  <script src="writer.js?v=15"></script>
  <script type="module" src="../js/theme.js?v=1"></script>
</body>
</html>
