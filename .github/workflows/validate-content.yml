name: Validate story content
on:
  push:
    paths: ["content/**"]
  pull_request:
    paths: ["content/**"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-content.mjs
